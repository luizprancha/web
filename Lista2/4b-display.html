<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lado a Lado</title>
    <style>
         *{margin:0px; padding: 0px;}
         body {
            height: 100vh;
            display: flex;
        }
         body{height:100vh}

         .box{border:1px solid black;
            box-sizing: border-box;
            display: inline-block; 
            width:25vw;
            height:56vh;
            font-size: 16px;
        }
        #box1{background-color: hotpink;}
        #box2{background-color: yellow;}
        #box3{background-color: green;}
        #box4{background-color: blue;
             }
    </style>
</head>
<body>
<div id="box1" class="box">1</div><div id="box2" class="box">2</div><div id="box3" class="box">3</div><div id="box4" class="box">4</div>
</body>
</html>
