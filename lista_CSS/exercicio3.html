<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layout</title>
    <style>
        body {
            font-size: 50pt;
        }
        .container {
            display: grid;
            height: 100vh;
            padding: 20px;
            gap: 15px;

            grid-template-columns: 2fr 1fr 2fr 1fr;
            grid-template-rows: 1fr 3fr;
            grid-template-areas:"A A . B"
                                "C D D D";
        }
        .box {
            padding: 15px;
            color: white;
            background-color: rgb(44, 44, 44);
            border-radius: 10%;
        }

        #box1 { grid-area: A; }
        #box2 { grid-area: B; }
        #box3 { grid-area: C; } 
        #box4 { 
            display: grid;
            grid-area: D; 
            grid-template-columns: 1fr 2fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 10px;
            padding: 20px;
        }
        .boxbranca {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: lightgrey;
            color: rgb(44, 44, 44);
            border-radius: 20%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="box1">A</div>
        <div class="box" id="box2">B</div>
        <div class="box" id="box3">C</div>
        
        <div class="box" id="box4">
            <div class="boxbranca">E</div>
            <div class="boxbranca">F</div>
            <div class="boxbranca">G</div>
            <div class="boxbranca">M</div>
            <div class="boxbranca">I</div>
            <div class="boxbranca">J</div>
        </div>
    </div>
</body>
</html>
