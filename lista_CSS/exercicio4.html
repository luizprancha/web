<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>colorida</title>
    <style>
        .container{
            display:grid;
            height: 100vh;

            grid-template-columns:1fr 3fr 1fr;
            grid-template-rows:  1fr 1fr 5fr 1fr 1fr;
            grid-template-areas: 
                            "header header header"
                            "lefts  banner rights"
                            "lefts  main   rights"
                            "lefts  low    rights"
                            "footer footer footer";

        }
        
        @media (max-width:600px) {
            .container{
                display:grid;
            
                grid-template-rows: 1fr 1fr 5fr 1fr 1fr;
                grid-template-columns: 1fr;
                grid-template-areas:"header "
                                    "banner"
                                    "lefts"
                                    "main"
                                    "rights"
                                    "low"
                                    "footer";

            }
        }
    
        .box{
            display: flex;
            justify-content: center;
            align-items: center; 
            margin:5px;
        }

        #box1 {grid-area: header; background-color: rgb(255, 178, 61); }
        #box2 {grid-area: banner; background-color: red;}
        #box3 {grid-area: lefts; background-color: green;}
        #box4 {grid-area: main; background-color: rgb(0, 4, 255);}
        #box5 {grid-area: rights; background-color: rgb(255, 166, 0);}
        #box6 { grid-area: low; background-color: green;}
        #box7 { grid-area: footer; background-color: rgb(4, 0, 255);}
        
    </style>
</head>
<body>
    <div class="container">
    <div class="box" id="box1">Header</div>
    <div class="box" id="box2">Banner</div>
    <div class="box" id="box3">Left Aside</div>
    <div class="box" id="box4">Main Content</div>
    <div class="box" id="box5">Right Aside</div>
    <div class="box" id="box6">Low Content</div>
    <div class="box" id="box7">Footer</div>
    </div>
</body>
</html>
