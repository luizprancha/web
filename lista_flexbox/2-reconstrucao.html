<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuario</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .borda{
            border: 2px solid orange;
            width: 600px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #titulo{
            text-align: center;
            color: darkgrey;
        }
        .box{
            background-color: darkgrey;
            width: 500px;
            height: 30px;
            margin: 5px;
            border-radius: 5px;
        }
        .circulo{
            background-color: darkgrey;
            width: 100px;
            height: 100px;
            margin-top: 400px;
            border-radius: 50%;
        }
        #box5{
            background-color: darkgrey;
            width: 250px;
            height: 30px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="borda">
        <h1 id="titulo">Company logo</h1>
        <div class="box" id="box1"></div>
        <div class="box" id="box2"></div>
        <div class="box" id="box3"></div>
        <div class="box" id="box4"></div>
        <div class="circulo" id="circulo"></div>
        <div class="box" id="box5"></div>
    </div>
</body>
</html>
