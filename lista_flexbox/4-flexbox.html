<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>estacoes</title>
    <style>
      .container{
        display:flex;
        height: 100vh;
        justify-content:space-around;
        flex-direction:row;
        }

        .box:hover{
            flex-grow: 100;
            transition:3s;
        }
            
        #box1{ 
            background-image:url("/imgs/estacoes.jpg");
            background-size: cover;
        }
        
        #box2{
            background-image:url("/imgs/inverno1.jpg");
            background-size: cover;
        }

         #box3{
            background-image:url("/imgs/outono.jpg");
            background-size: cover;
        }

         #box4{
            background-image:url("/imgs/primavera.jpg");
            background-size: cover;
        }

        #box5{
            background-image:url("/imgs/verao.webp");
            background-size: cover;
        }

        .box{
            height: 800px;
            flex-grow: 1;
            border-radius: 40px;
            margin:10px
        }

    </style>

</head>
<body>
    <div class="container">
        <div class="box" id="box1"> </div>
        <div class="box" id="box2"></div>
        <div class="box" id="box3"></div>
        <div class="box" id="box4"></div>
        <div class="box" id="box5"></div>
    </div>
</body>
</html>
