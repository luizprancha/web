<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estações</title>
    <style>
        .container{
            display: flex;
        }
        .box{
            width: 500px;
            height: 300px;
            margin: 5px;
            border-radius: 5px;
            background-repeat: no-repeat;
            background-size: cover;
        }
        #box1{
            background-image: url("../imgs/estacoes.jpg");
        }
        #box2{
            background-image: url("../imgs/verao.webp");
        }
        #box3{
            background-image: url("../imgs/primavera.jpg");
        }
        #box4{
            background-image: url("../imgs/inverno1.jpg");
        }
        #box5{
            background-image: url("../imgs/outono.jpg");
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="box1"></div>
        <div class="box" id="box2"></div>
        <div class="box" id="box3"></div>
        <div class="box" id="box4"></div>
        <div class="box" id="box5"></div>
    </div>
</body>
</html>
