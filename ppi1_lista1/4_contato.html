<!DOCTYPE html>
<html>
<head>
    <title>Formulário de Contato</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <a href="3_curriculo.html">⬅ Voltar para o currículo</a>

    <h2>Formulário de Contato</h2>
    <p>Preencha os campos abaixo para entrar em contato.</p>

    <form>

        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>

        <label for="assunto">Assunto:</label>
        <input type="text" id="assunto" name="assunto" placeholder="Digite o assunto">

        <label for="estado">Estado:</label>
        <select id="estado" name="estado">
            <option value="">Selecione um estado</option>
            <option value="SC">Santa Catarina</option>
            <option value="PR">Paraná</option>
            <option value="RS">Rio Grande do Sul</option>
            <option value="SP">São Paulo</option>
            <option value="RJ">Rio de Janeiro</option>
            <option value="MG">Minas Gerais</option>
        </select>

        <label for="mensagem">Mensagem:</label>
        <textarea id="mensagem" name="mensagem" placeholder="Digite sua mensagem aqui" rows="5"></textarea>

        <button type="submit">Enviar</button>

    </form>

</body>
</html>
