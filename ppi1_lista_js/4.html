<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMC</title>
</head>
<body>
    <h1>Índice de Massa Corporal (IMC) </h1>

      <label for ="nome">Nome:</label>
      <input type="text" id="nome">

      <label for ="peso">Peso(kg):</label>
      <input type="number" id="peso" step="0.1">

      <label for ="altura">Altura(m):</label>
      <input type="number" id="altura" step="0.01">

    <button id="btn">Calcular massa</button>

    <p id="resultadoIMC"></p>
    <p id="classificacao"></p>
    <img id="imgPerfil">

    <script>
    
    

        let nome = document.querySelector("#nome");
        let peso = document.querySelector("#peso");
        let altura = document.querySelector("#altura");

        let resultadoIMC = document.querySelector("#resultadoIMC");
        let classificacao = document.querySelector("#classificacao");
        let imgPerfil = document.querySelector("#imgPerfil");
 
        let button =document.querySelector("#btn");


       button.addEventListener("click", ()=>{

        
        let a = Number(peso.value)
        let b = Number(altura.value)


          let imc = a / (b * b);
              resultadoIMC.innerHTML = `IMC: ${imc.toFixed(2)}`;

        if (imc  < 18.5 ){
        classificacao.innerHTML = "Abaixo do peso";
        } 
        
        else if(imc >= 18.5 && imc < 24.9){
            classificacao.innerHTML = "Peso normal";
        }
        
        else if(imc >= 25 &&  imc < 29.9){
          classificacao.innerHTML = ("SobrePeso")
        }
        
        else if(imc >= 30 && imc < 34.9){
           classificacao.innerHTML = ("Obesidade nivel 1")
        }
        
        else if( imc >= 35 &&  imc < 39.9){
           classificacao.innerHTML = ("Obesidade nivel 2")
        }
        
        else if( imc > 40){
            classificacao.innerHTML = ("Obesidade nivel 3")
        }
        

        let foto = Math.floor(imc);

            switch(true){

            case (foto < 18.5 ):
                    imgPerfil.src = "abaixopeso.png";
                    break;

            case (foto >= 18.5 && foto < 24.9):
                    imgPerfil.src = "normal.png";
                    break;
            
             case (foto >= 25 && foto < 29.9):
                    imgPerfil.src = "sobrepeso.png";
                    break;

            case (foto >= 30 && foto < 34.9):
                    imgPerfil.src = "obesidade1.png";
                    break;
            case (foto >= 35 && foto < 39.9):
                    imgPerfil.src = "obesidade2.png";
                    break;
            
            default:
                    imgPerfil.src = "obesidade3.png";
                  
            }
            
       })

    </script>

</body>
</html>
