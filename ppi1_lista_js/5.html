<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteio</title>
</head>
<body>
    <h1>Sorteio de números</h1>

     <label for ="a">Primeiro</label>
    <input type="number" id="a">
      <label for ="b">Segundo</label>
    <input type="number" id="b">

   

    <div id="resultado"></div>
    <button id="bt">Sortear</button>

    <script>
       a,b,resultado
       let button =document.querySelector("#bt");
       button.addEventListener("click", ()=>{

            let vmin = Number(a.value)
            let vmax = Number(b.value)
            let r= Math.floor(Math.random()*(vmax-vmin)+vmin)
            console.log(r)
        
            let p = document.createElement("p")
            p.innerHTML=r
            p.style.display ="inline-block"
            p.style.border ="1px, solid, black"
            p.style.borderRadius ="50%"
            p.style.padding = "10px"
            p.style.gap ="1px"
            resultado.appendChild(p)
        })

    </script>
</body>
</html>
